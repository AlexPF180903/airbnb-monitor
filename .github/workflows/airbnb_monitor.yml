name: Airbnb Availability Monitor

on:
  schedule:
    # Cada hora (minuto 17 para evitar la congestión de la hora en punto). UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Enviar un mensaje de prueba a Telegram antes de monitorear"
        type: boolean
        default: false
      force_notify:
        description: "Enviar alerta aunque ya se haya notificado antes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: airbnb-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium de Playwright
        run: playwright install --with-deps chromium

      - name: Restaurar estado previo (evita alertas repetidas)
        uses: actions/cache@v4
        with:
          path: .state
          key: airbnb-state-${{ github.run_id }}
          restore-keys: |
            airbnb-state-

      - name: Probar Telegram (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --test-telegram

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcionales: si no existen como "Variables" del repo, se usan los valores por defecto.
          ROOM_ID: ${{ vars.ROOM_ID }}
          CHECK_IN: ${{ vars.CHECK_IN }}
          CHECK_OUT: ${{ vars.CHECK_OUT }}
          ADULTS: ${{ vars.ADULTS }}
          NOTIFY_EVERY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify && 'true' || 'false' }}
        run: python monitor.py

      - name: Subir evidencia de depuración
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
